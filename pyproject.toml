[project]
name = "health-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litestar>=2.0",
    "hypercorn>=0.17",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["health_data"]
