<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oura</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf8f4; --card: #fffefb; --line: #e6e2d8;
    --ink: #17150f; --muted: #8b8676; --faint: #b5b0a1;
    --accent: #3056d3; --good: #2e7d4f; --bad: #b3452f;
  }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         background: var(--bg); color: var(--ink);
         padding: 2.2rem 1.6rem 4rem; max-width: 1180px; margin: 0 auto; }
  a { color: inherit; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  .kicker { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; margin-bottom: 0.55rem; }
  h1 { font-size: 2.4rem; font-weight: 600; letter-spacing: -0.02em; }
  h1 .dim { color: var(--faint); }
  .substat { font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; }
  .actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .status-note { font-size: 0.72rem; color: var(--muted); margin-right: 0.4rem; }
  .btn { padding: 0.42rem 0.95rem; border-radius: 999px; border: 1px solid var(--line);
         background: var(--card); color: var(--ink); font-family: inherit;
         font-size: 0.74rem; cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--muted); }
  .btn-primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .error { display: none; border: 1px solid var(--bad); color: var(--bad);
           border-radius: 8px; padding: 0.7rem 1rem; margin-top: 1.2rem; font-size: 0.78rem; }
  .section { margin-top: 2.6rem; }
  .section > .label { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.8rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
          gap: 0.7rem; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 0.95rem 1rem 0.8rem; display: flex; flex-direction: column; gap: 0.45rem; }
  .tile .name { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.02em; }
  .tile .value { font-size: 1.65rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .tile .value .unit { font-size: 0.72rem; font-weight: 400; color: var(--muted); margin-left: 0.18rem; }
  .tile .delta { font-size: 0.68rem; color: var(--muted); }
  .tile .delta .up { color: var(--good); } .tile .delta .down { color: var(--bad); }
  .spark { margin-top: 0.15rem; }
  .spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
  .spark line { stroke: var(--line); stroke-width: 1; }
  .empty { color: var(--faint); font-size: 0.8rem; padding: 0.6rem 0; }
  .footer { margin-top: 3rem; font-size: 0.7rem; color: var(--faint); }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="kicker" id="today-line">…</div>
    <h1><span id="greet">good day</span><span class="dim" id="cursor">█</span></h1>
    <div class="substat" id="substat">— metrics · — days of history</div>
  </div>
  <div class="actions">
    <span class="status-note" id="last-sync"></span>
    <span class="status-note" id="backfill-status"></span>
    <button class="btn btn-primary" id="sync-btn" onclick="doSync()">sync now</button>
    <button class="btn" id="backfill-btn" onclick="doBackfill()">backfill history</button>
    <a class="btn" href="/setup">settings</a>
  </div>
</div>
<div class="error" id="sync-error"></div>
<div id="app"><div class="empty" style="margin-top:2rem">loading…</div></div>
<div class="footer">every metric the ring reports lands here — new collections appear automatically. raw db: app_data/oura/sqlite/health.db</div>

<script>
/* ---------- greeting ---------- */
const now = new Date();
const H = parseInt(now.toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour12:false,hour:'numeric'}));
const greet = H<5 ? 'good night' : H<12 ? 'good morning' : H<17 ? 'good afternoon' : H<21 ? 'good dusk' : 'good night';
document.getElementById('greet').textContent = greet;
document.getElementById('today-line').textContent =
  now.toLocaleDateString('en-US',{timeZone:'America/Los_Angeles',weekday:'long',month:'long',day:'numeric'}).toLowerCase();

/* ---------- sync / backfill plumbing (behavior unchanged) ---------- */
function showLastSync(ts){
  const el=document.getElementById('last-sync');
  if(!ts){el.textContent='';return;}
  const m=Math.round((new Date()-new Date(ts))/60000);
  el.textContent='synced '+(m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago');
}
function showSyncError(msg){
  const el=document.getElementById('sync-error');
  if(!msg){el.style.display='none';el.textContent='';return;}
  el.textContent='sync failed: '+msg; el.style.display='block';
}
async function doSync(){
  const b=document.getElementById('sync-btn'); b.textContent='syncing…'; b.disabled=true;
  try{
    const r=await fetch('/sync',{method:'POST'});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||d.status==='error'){showSyncError(d.detail||('HTTP '+r.status));}
    else{showSyncError(null); if(d.last_sync)showLastSync(d.last_sync); location.reload(); return;}
  }catch(e){showSyncError('could not reach the server. '+e);}
  b.textContent='sync now'; b.disabled=false;
}
fetch('/api/status').then(r=>r.json()).then(d=>{
  if(d.last_sync)showLastSync(d.last_sync);
  showSyncError(d.last_error);
}).catch(()=>{});
let backfillPoll=null;
function renderBackfill(d){
  const el=document.getElementById('backfill-status'), btn=document.getElementById('backfill-btn');
  if(d.state==='running'){
    el.textContent='backfilling… '+Math.round((d.progress||0)*100)+'%';
    btn.disabled=true; btn.textContent='backfilling…'; return true;
  }
  btn.disabled=false; btn.textContent='backfill history';
  el.textContent = d.state==='done' ? 'backfill complete' : d.state==='error' ? 'backfill failed' : '';
  return false;
}
function pollBackfill(){
  fetch('/api/backfill-status').then(r=>r.json()).then(d=>{
    const running=renderBackfill(d);
    if(running&&!backfillPoll){backfillPoll=setInterval(pollBackfill,3000);}
    else if(!running&&backfillPoll){clearInterval(backfillPoll);backfillPoll=null;location.reload();}
  }).catch(()=>{});
}
async function doBackfill(){
  if(!confirm('Pull your entire Oura history? Runs in the background.'))return;
  await fetch('/backfill',{method:'POST'}); pollBackfill();
}
pollBackfill();

/* ---------- metric metadata ---------- */
/* kind: score | seconds | count | bpm | ms | pct | temp | plain */
const META = {
  sleep_score:            ['sleep score','score','sleep'],
  total_sleep_duration:   ['total sleep','seconds','sleep'],
  deep_sleep_duration:    ['deep sleep','seconds','sleep'],
  rem_sleep_duration:     ['rem sleep','seconds','sleep'],
  light_sleep_duration:   ['light sleep','seconds','sleep'],
  average_hrv:            ['sleeping hrv','ms','sleep'],
  average_heart_rate:     ['sleeping hr','bpm','sleep'],
  lowest_heart_rate:      ['lowest hr','bpm','sleep'],
  efficiency:             ['sleep efficiency','pct','sleep'],
  latency:                ['sleep latency','seconds','sleep'],
  readiness_score:        ['readiness','score','recovery'],
  temperature_deviation:  ['temp deviation','temp','recovery'],
  daily_resilience_sleep_recovery:    ['resilience · sleep recovery','score','recovery'],
  daily_resilience_daytime_recovery:  ['resilience · daytime','score','recovery'],
  daily_resilience_stress:            ['resilience · stress','score','recovery'],
  stress_high_seconds:            ['stress high time','seconds','stress'],
  stress_recovery_high_seconds:   ['recovery high time','seconds','stress'],
  spo2_average:                   ['spo2 average','pct','breath'],
  breathing_disturbance_index:    ['breathing disturbance index','plain','breath'],
  activity_score:                 ['activity score','score','activity'],
  activity_steps:                 ['steps','count','activity'],
  activity_active_calories:       ['active calories','count','activity'],
  activity_total_calories:        ['total calories','count','activity'],
  activity_equivalent_walking_distance: ['walking equivalent','meters','activity'],
  activity_high_time:             ['high activity time','seconds','activity'],
  activity_medium_time:           ['medium activity time','seconds','activity'],
  activity_low_time:              ['low activity time','seconds','activity'],
  activity_sedentary_time:        ['sedentary time','seconds','activity'],
  activity_average_met_minutes:   ['avg met minutes','plain','activity'],
  cardiovascular_age:             ['cardiovascular age','plain','heart'],
  vo2_max:                        ['vo2 max','plain','heart'],
};
const SECTIONS = ['sleep','recovery','stress','breath','activity','heart','more'];
function metaFor(k){
  if(META[k]) return META[k];
  let kind='plain', sec='more';
  if(/duration|_time|seconds|latency/.test(k)) kind='seconds';
  else if(/score/.test(k)) kind='score';
  else if(/steps|calories|count/.test(k)) kind='count';
  if(/^sleep_score_/.test(k)) sec='sleep';
  else if(/^readiness_/.test(k)) sec='recovery';
  else if(/^daily_stress|^stress/.test(k)) sec='stress';
  else if(/^activity_/.test(k)) sec='activity';
  else if(/^daily_resilience/.test(k)) sec='recovery';
  return [k.replace(/_/g,' '), kind, sec];
}
function fmt(v,kind){
  if(v==null) return ['–',''];
  switch(kind){
    case 'seconds': { const h=Math.floor(v/3600), m=Math.round((v%3600)/60);
                      return h>0?[h+'h '+String(m).padStart(2,'0'),'m']:[m,'min']; }
    case 'pct':     return [(Math.round(v*10)/10),'%'];
    case 'ms':      return [Math.round(v),'ms'];
    case 'bpm':     return [Math.round(v),'bpm'];
    case 'temp':    return [(v>0?'+':'')+ (Math.round(v*100)/100),'°c'];
    case 'count':   return [Math.round(v).toLocaleString(),''];
    case 'score':   return [Math.round(v),''];
    case 'meters':  return [(v/1000).toFixed(1),'km'];
    default:        return [Math.round(v*10)/10,''];
  }
}
function spark(series){
  if(series.length<2) return '';
  const w=180,h=34,vals=series.map(p=>p[1]);
  const mn=Math.min(...vals), mx=Math.max(...vals), span=(mx-mn)||1;
  const pts=series.map((p,i)=>[(i/(series.length-1))*(w-4)+2, h-3-((p[1]-mn)/span)*(h-8)]);
  const d='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="45-day trend"><line x1="2" y1="${h-3}" x2="${w-2}" y2="${h-3}"/><path d="${d}"><title>last ${series.length} days · min ${Math.round(mn*10)/10} · max ${Math.round(mx*10)/10}</title></path></svg>`;
}
function tile(key, series){
  const [name,kind]=metaFor(key);
  const latest=series[series.length-1], prev=series[series.length-2];
  const [val,unit]=fmt(latest?latest[1]:null, kind);
  let delta='';
  if(latest&&prev&&prev[1]){
    const diff=latest[1]-prev[1];
    const cls=diff>=0?'up':'down', sign=diff>=0?'+':'−';
    const [dv,du]=fmt(Math.abs(diff),kind);
    delta=`<span class="${cls}">${sign}${dv}${du}</span> vs prev · ${latest[0].slice(5)}`;
  } else if(latest){ delta=latest[0]; }
  return `<div class="tile"><div class="name">${name}</div>`+
         `<div class="value">${val}<span class="unit">${unit}</span></div>`+
         `<div class="delta">${delta}</div>${spark(series)}</div>`;
}

/* ---------- render ---------- */
fetch('/api/overview').then(r=>r.json()).then(d=>{
  const metrics=d.metrics||{};
  const keys=Object.keys(metrics);
  const app=document.getElementById('app');
  if(!keys.length){
    app.innerHTML='<div class="empty" style="margin-top:2rem">no data yet — the first sync or the backfill will fill this page. every collection the ring reports gets a tile.</div>';
    return;
  }
  const days=new Set(); keys.forEach(k=>metrics[k].forEach(p=>days.add(p[0])));
  document.getElementById('substat').textContent = keys.length+' metrics · '+days.size+' days shown · 45-day window';
  const bySec={};
  keys.sort().forEach(k=>{ const sec=metaFor(k)[2]; (bySec[sec]=bySec[sec]||[]).push(k); });
  app.innerHTML = SECTIONS.filter(s=>bySec[s]).map(s=>
    `<div class="section"><div class="label">${s}</div><div class="grid">`+
    bySec[s].map(k=>tile(k,metrics[k])).join('')+`</div></div>`).join('');
}).catch(e=>{
  document.getElementById('app').innerHTML='<div class="empty">failed to load overview: '+e+'</div>';
});

/* blinking cursor, sieve-style */
setInterval(()=>{const c=document.getElementById('cursor');c.style.visibility=c.style.visibility==='hidden'?'visible':'hidden';},600);
</script>
</body>
</html>
